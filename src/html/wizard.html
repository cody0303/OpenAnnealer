<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>OpenAnnealer Setup Wizard</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.3/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
</head>

<body>

<div class="container mx-auto max-w-md px-4 py-8">
    <h1 class="text-2xl font-bold text-center">OpenAnnealer</h1>
    <p class="text-center text-base-content/60 mb-6">WiFi Setup</p>

    <div class="card bg-base-100 shadow">
        <div class="card-body">
            <form action="/rest/wireless_config" id="wifi-config" class="grid grid-cols-1 gap-3">
                <div class="grid grid-cols-1 gap-1">
                    <span class="label-text">SSID</span>
                    <input type="text" name="w0" maxlength="32" class="input input-bordered">
                </div>

                <div class="grid grid-cols-1 gap-1">
                    <span class="label-text">Password</span>
                    <input type="password" name="w1" maxlength="63" placeholder="********" class="input input-bordered">
                </div>

                <div class="grid grid-cols-1 gap-1">
                    <span class="label-text">WiFi Authentication Method</span>
                    <select name="w2" class="select select-bordered">
                        <option value="0">None</option>
                        <option value="1">WPA-TKIP</option>
                        <option value="2">WPA2-AES</option>
                        <option value="3">WPA2-MIXED</option>
                    </select>
                </div>

                <div class="grid grid-cols-1 gap-1">
                    <span class="label-text">WiFi Connect Timeout (ms)</span>
                    <input type="number" name="w3" step="1000" value="30000" class="input input-bordered">
                </div>

                <div class="grid grid-cols-1 gap-1">
                    <span class="label-text">Enable WiFi</span>
                    <select name="w4" class="select select-bordered">
                        <option value="true">Yes</option>
                        <option value="false">No</option>
                    </select>
                </div>

                <button type="button" id="submit-btn" class="btn btn-primary mt-2">Complete &amp; Reboot</button>
            </form>
        </div>
    </div>

    <div class="divider">or</div>

    <button type="button" id="standalone-btn" class="btn btn-neutral w-full" onclick="window.location.href='/mobile'">Use Standalone</button>
    <p class="text-center text-sm text-base-content/60 mt-2">Skip WiFi setup and use the full app directly - the device stays in its own access point mode.</p>
</div>


<script>

    // Submit the form data to the action URI
    function putForm(targetForm, saveToEeprom) {
        const paramData = new FormData(targetForm);

        // Remove empty param
        for (const [key, value] of paramData.entries()) {
            if (value == "") {
                paramData.delete(key);
            }
        }

        if (saveToEeprom) {
            paramData.append('ee', true)
        }

        const queryString = new URLSearchParams(paramData).toString();
        const uri = new URL(targetForm.action + '?');
        uri.search = queryString;

        // Post the new param with GET method
        fetch(uri)
        .then(response => {
            return response.json();
        })
        .then(data => {
            // Populate values
            const uri = targetForm.getAttribute("action");
            fetch(uri)
            .then(response => {
                return response.json();
            })
            .then(data => {
                // Populate the form
                for (const key in data) {
                    const element = targetForm.querySelector('[name="' + key + '"]');
                    if (element) {
                        element.value = String(data[key]);
                    }
                }
            })
        })
    }

    document.getElementById("submit-btn").addEventListener("click", (event) => {
        event.preventDefault();

        const form = document.getElementById("wifi-config")

        putForm(form, true);

        // Send reboot request
        const uri = "/rest/system_control?s5=true";
        fetch(uri);
    })

    function populateWifiConfig() {
        // Populate values
        const form = document.getElementById("wifi-config")
        if (form) {
            const uri = form.getAttribute("action");
            fetch(uri)
            .then(response => {
                return response.json();
            })
            .then(data => {
                // Populate the form
                for (const key in data) {
                    const element = form.querySelector('[name="' + key + '"]');
                    if (element) {
                        element.value = String(data[key]);
                    }
                }
            })
        }
    }

    // Start the long polling process when the page loads
    document.addEventListener('DOMContentLoaded', function() {populateWifiConfig();});
</script>
</body>
</html>
